; console@.ini - libsystemd unit template, instantiated once per tty device
; by the [class=tty] rule in console.rules.
;
; %i expands to the tty node's short name (e.g. "tty1"); %v expands to the
; user_value libsystemd_notify_device_added() was called with for it - the
; node's full absolute path, reported by dmtty's dmdrvi_path_ready DIF (see
; ../../../docs/configuration.md and dmsystem's docs/configuration.md).
;
; console itself is just a launcher (see ../README.md): it reads $DMOD_SHELL
; for the module to run and binds its stdin/stdout/stderr/stdlog to the path
; given as its own argument - hence args/stdin/stdout/stderr/stdlog all being
; %v here. It starts the shell detached and then hands this unit's main PID
; over to it (libsystemd_notify_main_pid()) before exiting, so from here on
; the unit *is* the shell: `service status console@<name>` reports the shell,
; and `service stop console@<name>` stops it.
description=Console on %i
exec=console
args=%v %n
stdin=%v
stdout=%v
stderr=%v
stdlog=%v
type=oneshot

; No restart= here (defaults to "no"). Since console hands the unit over to
; the shell, a restart policy would apply to the *shell's* exit, not to
; console's - i.e. it would respawn a session every time the user typed
; `exit`, which is not what a console on a physical port should do.
; Re-attaching the device (or `service start console@<name>` by hand) starts
; a new session instead.
